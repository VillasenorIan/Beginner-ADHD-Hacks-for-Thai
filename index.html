<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Command Deck: Temporal Logistics</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .thai-text { font-family: "Sarabun", "Kanit", "Leelawadee UI", sans-serif; }
        /* Scrollbar hiding for clean UI */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ==========================================
        // DATA LOGISTICS: THE MASTER INDEX & MODULES
        // ==========================================
        
        const DATABASE = {
            temporal_logistics: {
                title: "Temporal Logistics (Dates & Time)",
                modules: {
                    days: {
                        title: "Days of the Week (The 'Wan' Protocol)",
                        description: "Every day starts with 'Wan' (Day) and is anchored to a celestial body.",
                        cards: [
                            {
                                id: "d1",
                                english: "Monday",
                                literal: "Day + Moon",
                                thaiFull: "วันจันทร์",
                                tokens: [
                                    { thai: "วัน", phonics: "Wan", meaning: "Day", tone: "Mid" },
                                    { thai: "จันทร์", phonics: "Jan", meaning: "Moon", tone: "Mid" }
                                ]
                            },
                            {
                                id: "d2",
                                english: "Tuesday",
                                literal: "Day + Mars",
                                thaiFull: "วันอังคาร",
                                tokens: [
                                    { thai: "วัน", phonics: "Wan", meaning: "Day", tone: "Mid" },
                                    { thai: "อัง", phonics: "Ang", meaning: "Mars (Pt 1)", tone: "Mid" },
                                    { thai: "คาร", phonics: "khaan", meaning: "Mars (Pt 2)", tone: "Mid" }
                                ]
                            },
                            {
                                id: "d3",
                                english: "Wednesday",
                                literal: "Day + Mercury",
                                thaiFull: "วันพุธ",
                                tokens: [
                                    { thai: "วัน", phonics: "Wan", meaning: "Day", tone: "Mid" },
                                    { thai: "พุธ", phonics: "Phut", meaning: "Mercury", tone: "High" }
                                ]
                            },
                            {
                                id: "d4",
                                english: "Thursday",
                                literal: "Day + Jupiter",
                                thaiFull: "วันพฤหัสบดี",
                                tokens: [
                                    { thai: "วัน", phonics: "Wan", meaning: "Day", tone: "Mid" },
                                    { thai: "พฤ", phonics: "Pha", meaning: "Jup (1)", tone: "High" },
                                    { thai: "หัส", phonics: "hat", meaning: "Jup (2)", tone: "Low" }
                                ]
                            },
                            {
                                id: "d5",
                                english: "Friday",
                                literal: "Day + Venus",
                                thaiFull: "วันศุกร์",
                                tokens: [
                                    { thai: "วัน", phonics: "Wan", meaning: "Day", tone: "Mid" },
                                    { thai: "ศุกร์", phonics: "Suk", meaning: "Venus", tone: "Low" }
                                ]
                            },
                            {
                                id: "d6",
                                english: "Saturday",
                                literal: "Day + Saturn",
                                thaiFull: "วันเสาร์",
                                tokens: [
                                    { thai: "วัน", phonics: "Wan", meaning: "Day", tone: "Mid" },
                                    { thai: "เสาร์", phonics: "Sao", meaning: "Saturn", tone: "Rising" }
                                ]
                            },
                            {
                                id: "d7",
                                english: "Sunday",
                                literal: "Day + Sun",
                                thaiFull: "วันอาทิตย์",
                                tokens: [
                                    { thai: "วัน", phonics: "Wan", meaning: "Day", tone: "Mid" },
                                    { thai: "อา", phonics: "Aa", meaning: "Sun (1)", tone: "Mid" },
                                    { thai: "ทิตย์", phonics: "thit", meaning: "Sun (2)", tone: "High" }
                                ]
                            }
                        ]
                    },
                    months: {
                        title: "Months of the Year (30/31 Algorithm)",
                        description: "Months ending in -khom (คม) have 31 days. Months ending in -yon (ยน) have 30. -phan is Feb.",
                        cards: [
                            {
                                id: "m1",
                                english: "January (31 Days)",
                                literal: "Makara (Capricorn) + 31 Days",
                                thaiFull: "มกราคม",
                                tokens: [
                                    { thai: "มก", phonics: "Mak", meaning: "Capricorn", tone: "High" },
                                    { thai: "รา", phonics: "raa", meaning: "Zodiac suffix", tone: "Mid" },
                                    { thai: "คม", phonics: "khom", meaning: "31 Days Suffix", tone: "Mid" }
                                ]
                            },
                            {
                                id: "m2",
                                english: "April (30 Days)",
                                literal: "Mesha (Aries) + 30 Days",
                                thaiFull: "เมษายน",
                                tokens: [
                                    { thai: "เม", phonics: "May", meaning: "Aries", tone: "Mid" },
                                    { thai: "ษา", phonics: "saa", meaning: "Zodiac suffix", tone: "Rising" },
                                    { thai: "ยน", phonics: "yon", meaning: "30 Days Suffix", tone: "Mid" }
                                ]
                            },
                            {
                                id: "m3",
                                english: "October (31 Days - Your Trip)",
                                literal: "Tula (Libra) + 31 Days",
                                thaiFull: "ตุลาคม",
                                tokens: [
                                    { thai: "ตุ", phonics: "Tu", meaning: "Libra", tone: "Low" },
                                    { thai: "ลา", phonics: "laa", meaning: "Zodiac suffix", tone: "Mid" },
                                    { thai: "คม", phonics: "khom", meaning: "31 Days Suffix", tone: "Mid" }
                                ]
                            },
                            {
                                id: "m4",
                                english: "December (31 Days)",
                                literal: "Dhanu (Sagittarius) + 31 Days",
                                thaiFull: "ธันวาคม",
                                tokens: [
                                    { thai: "ธัน", phonics: "Than", meaning: "Sagittarius", tone: "Mid" },
                                    { thai: "วา", phonics: "waa", meaning: "Zodiac suffix", tone: "Mid" },
                                    { thai: "คม", phonics: "khom", meaning: "31 Days Suffix", tone: "Mid" }
                                ]
                            }
                        ]
                    },
                    relative: {
                        title: "Time Indicators (The Vectors)",
                        description: "Anchoring your position in time.",
                        cards: [
                            {
                                id: "t1",
                                english: "Today",
                                literal: "Day + This",
                                thaiFull: "วันนี้",
                                tokens: [
                                    { thai: "วัน", phonics: "Wan", meaning: "Day", tone: "Mid" },
                                    { thai: "นี้", phonics: "nee", meaning: "This", tone: "High" }
                                ]
                            },
                            {
                                id: "t2",
                                english: "Tomorrow",
                                literal: "Tomorrow + This",
                                thaiFull: "พรุ่งนี้",
                                tokens: [
                                    { thai: "พรุ่ง", phonics: "Phrung", meaning: "Tomorrow (Root)", tone: "Falling" },
                                    { thai: "นี้", phonics: "nee", meaning: "This", tone: "High" }
                                ]
                            },
                            {
                                id: "t3",
                                english: "Yesterday",
                                literal: "When/Past + Day",
                                thaiFull: "เมื่อวาน",
                                tokens: [
                                    { thai: "เมื่อ", phonics: "Muea", meaning: "When/Past", tone: "Falling" },
                                    { thai: "วาน", phonics: "waan", meaning: "Day (Past context)", tone: "Mid" }
                                ]
                            }
                        ]
                    },
                    holidays: {
                        title: "Holidays (Wan Yut & Chaos)",
                        description: "When the transit system gets chaotic.",
                        cards: [
                            {
                                id: "h1",
                                english: "Holiday / Day Off",
                                literal: "Day + Stop",
                                thaiFull: "วันหยุด",
                                tokens: [
                                    { thai: "วัน", phonics: "Wan", meaning: "Day", tone: "Mid" },
                                    { thai: "หยุด", phonics: "yut", meaning: "To Stop", tone: "Low" }
                                ]
                            },
                            {
                                id: "h2",
                                english: "Songkran (Water Festival)",
                                literal: "Astrological Passage",
                                thaiFull: "สงกรานต์",
                                tokens: [
                                    { thai: "สง", phonics: "Song", meaning: "Passage", tone: "Rising" },
                                    { thai: "กรานต์", phonics: "kraan", meaning: "Festival", tone: "Mid" }
                                ]
                            }
                        ]
                    }
                }
            },
            transit_logistics: {
                title: "Transit Logistics (Bangkok BTS/MRT)",
                modules: {
                    ticketing: {
                        title: "Ticketing & Entry Procedures",
                        description: "Getting through the gates without friction.",
                        cards: [
                            {
                                id: "tr1",
                                english: "Station",
                                literal: "Base structural location",
                                thaiFull: "สถานี",
                                tokens: [
                                    { thai: "ส", phonics: "Sa", meaning: "Place (prefix)", tone: "Low" },
                                    { thai: "ถา", phonics: "thaa", meaning: "Base", tone: "Rising" },
                                    { thai: "นี", phonics: "nee", meaning: "Location", tone: "Mid" }
                                ]
                            },
                            {
                                id: "tr2",
                                english: "Skytrain",
                                literal: "Car + Fire/Electricity",
                                thaiFull: "รถไฟฟ้า",
                                tokens: [
                                    { thai: "รถ", phonics: "Rot", meaning: "Car/Vehicle", tone: "High" },
                                    { thai: "ไฟ", phonics: "fai", meaning: "Fire/Power", tone: "Mid" },
                                    { thai: "ฟ้า", phonics: "faa", meaning: "Sky", tone: "High" }
                                ]
                            }
                        ]
                    }
                }
            }
        };

        // ==========================================
        // UI COMPONENTS
        // ==========================================

        const App = () => {
            // STATE: Workspace Routing
            // currentView: 'HUB' | 'WORKSPACE'
            const [currentView, setCurrentView] = useState('HUB');
            
            // Track exactly what module we are in
            const [activeCategory, setActiveCategory] = useState(null);
            const [activeModule, setActiveModule] = useState(null);
            
            // STATE: Master Index Accordion Expansion
            const [expandedCategories, setExpandedCategories] = useState({});

            const toggleCategory = (catKey) => {
                setExpandedCategories(prev => ({
                    ...prev,
                    [catKey]: !prev[catKey]
                }));
            };

            const openWorkspace = (catKey, modKey) => {
                setActiveCategory(catKey);
                setActiveModule(modKey);
                setCurrentView('WORKSPACE');
            };

            const returnToHub = () => {
                setCurrentView('HUB');
                setActiveCategory(null);
                setActiveModule(null);
            };

            return (
                <div className="min-h-screen bg-slate-900 text-slate-200 p-4 md:p-8 flex justify-center">
                    <div className="w-full max-w-4xl border border-slate-700 bg-slate-800 rounded-lg shadow-2xl overflow-hidden flex flex-col h-[90vh]">
                        
                        {/* GLOBAL NAVIGATION BAR */}
                        <div className="bg-slate-950 border-b border-cyan-800/50 p-4 flex items-center justify-between shadow-md z-10">
                            <div className="flex items-center gap-4">
                                {currentView === 'WORKSPACE' && (
                                    <button 
                                        onClick={returnToHub}
                                        className="bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold py-1 px-4 rounded border border-cyan-800 transition-colors uppercase tracking-wider text-sm flex items-center gap-2"
                                    >
                                        <span>←</span> Master Index
                                    </button>
                                )}
                                <h1 className="text-xl font-black tracking-widest text-slate-100 uppercase">
                                    Neuro-Architect Deck <span className="text-cyan-500 font-normal">| v2.1</span>
                                </h1>
                            </div>
                        </div>

                        {/* VIEW ROUTER */}
                        <div className="flex-1 overflow-y-auto p-6 relative">
                            {currentView === 'HUB' && (
                                <MasterIndex 
                                    expanded={expandedCategories}
                                    toggle={toggleCategory}
                                    openWorkspace={openWorkspace}
                                />
                            )}
                            {currentView === 'WORKSPACE' && (
                                <Workspace 
                                    categoryKey={activeCategory} 
                                    moduleKey={activeModule} 
                                />
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- THE MASTER INDEX VIEW ---
        const MasterIndex = ({ expanded, toggle, openWorkspace }) => {
            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="mb-8">
                        <h2 className="text-2xl font-bold text-white uppercase tracking-wider mb-2">Central Logistics Hub</h2>
                        <p className="text-slate-400 text-sm">Select a sector to deploy its situational ZIP clusters. No scrolling. No distractions. Keep your working memory clean.</p>
                    </div>

                    <div className="space-y-4">
                        {Object.entries(DATABASE).map(([catKey, category]) => {
                            const isExpanded = expanded[catKey];
                            return (
                                <div key={catKey} className="border border-slate-700 rounded bg-slate-800/50 overflow-hidden">
                                    <button 
                                        onClick={() => toggle(catKey)}
                                        className="w-full text-left p-4 bg-slate-800 hover:bg-slate-700 transition-colors flex justify-between items-center"
                                    >
                                        <span className="font-bold text-lg text-cyan-50">{category.title}</span>
                                        <span className="text-cyan-500 font-mono text-xl">{isExpanded ? '−' : '+'}</span>
                                    </button>
                                    
                                    {isExpanded && (
                                        <div className="p-4 bg-slate-900/50 border-t border-slate-700 grid gap-3">
                                            {Object.entries(category.modules).map(([modKey, mod]) => (
                                                <div 
                                                    key={modKey} 
                                                    onClick={() => openWorkspace(catKey, modKey)}
                                                    className="p-4 border border-slate-700 rounded bg-slate-800 hover:border-cyan-500/50 hover:bg-slate-750 cursor-pointer transition-all group"
                                                >
                                                    <div className="flex justify-between items-center">
                                                        <div>
                                                            <h3 className="font-bold text-cyan-300 group-hover:text-cyan-100">{mod.title}</h3>
                                                            <p className="text-sm text-slate-400 mt-1">{mod.description}</p>
                                                        </div>
                                                        <span className="text-slate-500 group-hover:text-cyan-400 opacity-0 group-hover:opacity-100 transition-opacity">
                                                            ENTER →
                                                        </span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // --- THE ISOLATED WORKSPACE VIEW ---
        const Workspace = ({ categoryKey, moduleKey }) => {
            const data = DATABASE[categoryKey].modules[moduleKey];
            const [activeIndex, setActiveIndex] = useState(0); // For pagination if needed, but we'll list them linearly for study flow.

            return (
                <div className="animate-fade-in pb-12">
                    <div className="mb-8 border-b border-slate-700 pb-4">
                        <h2 className="text-3xl font-black text-white">{data.title}</h2>
                        <p className="text-cyan-400 mt-2 text-lg">{data.description}</p>
                    </div>

                    <div className="space-y-12">
                        {data.cards.map((card, index) => (
                            <StudyCard key={card.id} card={card} stepNum={index + 1} />
                        ))}
                    </div>
                    
                    <div className="mt-12 pt-6 border-t border-slate-700 text-center">
                        <button className="bg-cyan-900 hover:bg-cyan-800 text-cyan-100 font-bold py-3 px-8 rounded border border-cyan-700 tracking-wider shadow-lg">
                            TEST & VERIFY CHAIN (ACTIVE RECALL)
                        </button>
                    </div>
                </div>
            );
        };

        // --- THE STUDY CARD & KARAOKE ENGINE ---
        const StudyCard = ({ card, stepNum }) => {
            const [activeTokenIdx, setActiveTokenIdx] = useState(null);

            // Web Speech API Synthesis
            const speakSequence = (tokens, specificIndex = null) => {
                if (!('speechSynthesis' in window)) {
                    alert("Your browser does not support SpeechSynthesis.");
                    return;
                }
                window.speechSynthesis.cancel();

                if (specificIndex !== null) {
                    // Speak single isolated syllable
                    setActiveTokenIdx(specificIndex);
                    const utterance = new SpeechSynthesisUtterance(tokens[specificIndex].thai);
                    utterance.lang = 'th-TH';
                    utterance.rate = 0.8;
                    utterance.onend = () => setActiveTokenIdx(null);
                    window.speechSynthesis.speak(utterance);
                } else {
                    // Speak full word, highlighting sequentially
                    // Note: Reliable real-time word-boundary tracking in JS is notoriously flaky for Thai, 
                    // so we simulate the structural chunking perfectly for the ADHD brain.
                    let delay = 0;
                    tokens.forEach((tok, idx) => {
                        setTimeout(() => {
                            setActiveTokenIdx(idx);
                            const utterance = new SpeechSynthesisUtterance(tok.thai);
                            utterance.lang = 'th-TH';
                            utterance.rate = 0.85; // slightly slowed for clarity
                            
                            if (idx === tokens.length - 1) {
                                utterance.onend = () => setActiveTokenIdx(null);
                            }
                            window.speechSynthesis.speak(utterance);
                        }, delay);
                        delay += 900; // approximate gap for simulated structural playback
                    });
                }
            };

            return (
                <div className="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-md">
                    {/* Header */}
                    <div className="bg-slate-900 p-4 border-b border-slate-700 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <span className="bg-cyan-900 text-cyan-300 font-bold px-3 py-1 rounded text-sm">
                                STEP {stepNum}
                            </span>
                            <h3 className="text-xl font-bold text-white uppercase tracking-wider">{card.english}</h3>
                        </div>
                        <span className="text-slate-400 text-sm font-mono bg-slate-800 px-2 py-1 rounded">
                            {card.literal}
                        </span>
                    </div>

                    {/* Audio Control */}
                    <div className="p-6">
                        <button 
                            onClick={() => speakSequence(card.tokens)}
                            className="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-4 rounded mb-6 flex items-center justify-center gap-3 transition-colors border border-slate-600 shadow-inner"
                        >
                            <svg className="w-5 h-5 text-cyan-400" fill="currentColor" viewBox="0 0 20 20">
                                <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clipRule="evenodd" />
                            </svg>
                            PLAY AUDIO & FOLLOW SCRIPT
                        </button>

                        {/* Inline Karaoke Breakdown Box */}
                        <div className="bg-slate-900 border border-slate-700 rounded-lg p-6 overflow-x-auto">
                            <p className="text-xs text-slate-500 uppercase tracking-widest mb-4 font-bold border-b border-slate-800 pb-2">
                                Structural Script Decoder (Click Syllable to Isolate)
                            </p>
                            
                            <div className="flex gap-2 min-w-max">
                                {card.tokens.map((tok, idx) => (
                                    <div 
                                        key={idx}
                                        onClick={() => speakSequence(card.tokens, idx)}
                                        className={`flex flex-col items-center p-4 border-2 rounded-lg cursor-pointer transition-all duration-200 min-w-[120px] ${
                                            activeTokenIdx === idx 
                                                ? 'border-cyan-400 bg-cyan-900/30 transform scale-105 shadow-[0_0_15px_rgba(34,211,238,0.3)]' 
                                                : 'border-slate-700 bg-slate-800 hover:border-slate-500 hover:bg-slate-750'
                                        }`}
                                    >
                                        {/* Large Thai Script for visual mapping */}
                                        <div className="thai-text text-5xl font-black mb-3 text-white tracking-wide">
                                            {tok.thai}
                                        </div>
                                        
                                        {/* Phonics & Translation Data */}
                                        <div className="w-full text-center space-y-1">
                                            <div className="text-cyan-300 font-mono text-lg font-bold tracking-widest bg-black/30 rounded py-1">
                                                {tok.phonics}
                                            </div>
                                            <div className="text-slate-300 text-sm font-semibold truncate px-1">
                                                "{tok.meaning}"
                                            </div>
                                            <div className={`text-[10px] uppercase tracking-wider font-bold mt-2 px-2 py-0.5 rounded inline-block ${
                                                tok.tone === 'Mid' ? 'bg-slate-700 text-slate-300' :
                                                tok.tone === 'High' ? 'bg-red-900/50 text-red-300' :
                                                tok.tone === 'Low' ? 'bg-blue-900/50 text-blue-300' :
                                                tok.tone === 'Falling' ? 'bg-orange-900/50 text-orange-300' :
                                                'bg-purple-900/50 text-purple-300' // Rising
                                            }`}>
                                                {tok.tone} TONE
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
