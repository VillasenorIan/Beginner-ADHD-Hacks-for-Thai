<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Command Deck: Logistics</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .thai-text { font-family: "Sarabun", "Kanit", "Leelawadee UI", sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .locked-module { opacity: 0.5; pointer-events: none; filter: grayscale(100%); }
        .streak-fire { color: #f97316; text-shadow: 0 0 10px rgba(249,115,22,0.5); }
        .loader { border: 4px solid #1e293b; border-top: 4px solid #06b6d4; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ==========================================
        // 🚨 YOUR APPS SCRIPT URL GOES HERE 🚨
        // ==========================================
        const WEB_APP_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE"; 

        window.speechUtterances = [];

        const App = () => {
            const [DATABASE, setDatabase] = useState(null);
            const [isLoading, setIsLoading] = useState(true);
            const [fetchError, setFetchError] = useState(null);

            const [currentView, setCurrentView] = useState('HUB');
            const [activeCategory, setActiveCategory] = useState(null);
            const [activeModule, setActiveModule] = useState(null);
            const [expandedCategories, setExpandedCategories] = useState({});

            const [studyState, setStudyState] = useState({
                lastDate: new Date().toDateString(),
                completedToday: [],
                streaks: {}, 
                unlockedCount: 1, 
                allModules: []
            });

            // Boot Sequence: Fetch Data from Sheets
            useEffect(() => {
                if (WEB_APP_URL === "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE") {
                    setFetchError("API OFFLINE: Insert your Apps Script URL at Line 28.");
                    setIsLoading(false);
                    return;
                }

                fetch(WEB_APP_URL)
                    .then(res => res.json())
                    .then(data => {
                        setDatabase(data);
                        
                        let allModules = [];
                        Object.keys(data).forEach(cat => {
                            Object.keys(data[cat].modules).forEach(mod => {
                                allModules.push(`${cat}|${mod}`);
                            });
                        });

                        const saved = localStorage.getItem('thaiSpacedRepetition');
                        const today = new Date().toDateString();
                        
                        if (saved) {
                            try {
                                let parsed = JSON.parse(saved);
                                parsed.completedToday = parsed.completedToday || [];
                                parsed.streaks = parsed.streaks || {};
                                parsed.unlockedCount = parsed.unlockedCount || 1;

                                if (parsed.lastDate !== today) {
                                    parsed.completedToday = []; 
                                    parsed.lastDate = today;
                                    if (parsed.unlockedCount < allModules.length) {
                                        parsed.unlockedCount += 1;
                                    }
                                }
                                parsed.allModules = allModules; 
                                setStudyState(parsed);
                            } catch (e) {
                                console.error("Corrupt local state. Resetting.");
                            }
                        } else {
                            setStudyState(prev => ({ ...prev, allModules }));
                        }
                        setIsLoading(false);
                    })
                    .catch(err => {
                        console.error(err);
                        setFetchError("Failed to connect to Google Sheets Database. Check CORS or URL.");
                        setIsLoading(false);
                    });
            }, []);

            useEffect(() => {
                if (!isLoading && !fetchError) {
                    localStorage.setItem('thaiSpacedRepetition', JSON.stringify(studyState));
                }
            }, [studyState, isLoading, fetchError]);

            const toggleCategory = (catKey) => {
                setExpandedCategories(prev => ({ ...prev, [catKey]: !prev[catKey] }));
            };

            const openWorkspace = (catKey, modKey) => {
                setActiveCategory(catKey);
                setActiveModule(modKey);
                setCurrentView('WORKSPACE');
            };

            const handleCompletion = (catKey, modKey) => {
                const moduleId = `${catKey}|${modKey}`;
                setStudyState(prev => {
                    let newStreaks = { ...prev.streaks };
                    let currentStreak = newStreaks[moduleId]?.count || 0;
                    
                    newStreaks[moduleId] = {
                        count: currentStreak + 1,
                        lastStudied: prev.lastDate
                    };

                    return {
                        ...prev,
                        completedToday: [...prev.completedToday, moduleId],
                        streaks: newStreaks
                    };
                });
            };

            if (isLoading) {
                return (
                    <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center text-cyan-500 font-mono">
                        <div className="loader mb-4"></div>
                        <div>ESTABLISHING SATELLITE LINK TO GOOGLE SHEETS...</div>
                    </div>
                );
            }

            if (fetchError) {
                return (
                    <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center p-8">
                        <div className="bg-red-900/20 border border-red-500 text-red-400 p-6 rounded text-center max-w-lg shadow-[0_0_20px_rgba(239,68,68,0.3)]">
                            <h2 className="text-xl font-bold mb-2 uppercase tracking-widest">Connection Severed</h2>
                            <p className="font-mono text-sm">{fetchError}</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-900 text-slate-200 p-4 md:p-8 flex justify-center">
                    <div className="w-full max-w-4xl border border-slate-700 bg-slate-800 rounded-lg shadow-2xl overflow-hidden flex flex-col h-[90vh]">
                        <div className="bg-slate-950 border-b border-cyan-800/50 p-4 flex items-center justify-between shadow-md z-10 shrink-0">
                            <div className="flex items-center gap-4">
                                {currentView === 'WORKSPACE' && (
                                    <button 
                                        onClick={() => setCurrentView('HUB')}
                                        className="bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold py-1 px-4 rounded border border-cyan-800 transition-colors uppercase tracking-wider text-sm flex items-center gap-2"
                                    >
                                        <span>←</span> Hub
                                    </button>
                                )}
                                <h1 className="text-xl font-black tracking-widest text-slate-100 uppercase hidden sm:block">
                                    Command Deck <span className="text-cyan-500 font-normal">| Connected</span>
                                </h1>
                            </div>
                            <div className="text-sm font-mono text-cyan-400 bg-cyan-900/30 px-3 py-1 rounded border border-cyan-800">
                                BANDWIDTH: {studyState.completedToday.length}/3
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 sm:p-6 relative">
                            {currentView === 'HUB' && (
                                <MasterIndex 
                                    DATABASE={DATABASE}
                                    studyState={studyState}
                                    expanded={expandedCategories}
                                    toggle={toggleCategory}
                                    openWorkspace={openWorkspace}
                                />
                            )}
                            {currentView === 'WORKSPACE' && (
                                <Workspace 
                                    DATABASE={DATABASE}
                                    categoryKey={activeCategory} 
                                    moduleKey={activeModule}
                                    studyState={studyState}
                                    handleCompletion={handleCompletion}
                                />
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const MasterIndex = ({ DATABASE, studyState, expanded, toggle, openWorkspace }) => {
            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="mb-6 border-b border-slate-700 pb-4">
                        <h2 className="text-2xl font-bold text-white uppercase tracking-wider mb-2">Central Logistics Hub</h2>
                        <p className="text-slate-400 text-sm">Force 7-day mastery streaks. Max 3 sections per day. Data streams live from Google Sheets.</p>
                    </div>

                    <div className="space-y-4">
                        {Object.entries(DATABASE).map(([catKey, category]) => {
                            const isExpanded = expanded[catKey];
                            return (
                                <div key={catKey} className="border border-slate-700 rounded bg-slate-800/50 overflow-hidden">
                                    <button onClick={() => toggle(catKey)} className="w-full text-left p-4 bg-slate-800 hover:bg-slate-700 transition-colors flex justify-between items-center">
                                        <span className="font-bold text-lg text-cyan-50">{category.title}</span>
                                        <span className="text-cyan-500 font-mono text-xl">{isExpanded ? '−' : '+'}</span>
                                    </button>
                                    
                                    {isExpanded && (
                                        <div className="p-4 bg-slate-900/50 border-t border-slate-700 grid gap-3">
                                            {Object.entries(category.modules).map(([modKey, mod]) => {
                                                const moduleId = `${catKey}|${modKey}`;
                                                const globalIndex = studyState.allModules.indexOf(moduleId);
                                                const isUnlocked = globalIndex < studyState.unlockedCount;
                                                const streak = studyState.streaks[moduleId]?.count || 0;
                                                const isMastered = streak >= 7;
                                                const completedToday = studyState.completedToday.includes(moduleId);

                                                return (
                                                    <div 
                                                        key={modKey} 
                                                        onClick={() => isUnlocked ? openWorkspace(catKey, modKey) : null}
                                                        className={`p-4 border rounded transition-all group ${
                                                            !isUnlocked ? 'border-slate-800 bg-slate-900 locked-module' :
                                                            completedToday ? 'border-green-800/50 bg-green-900/20' :
                                                            isMastered ? 'border-yellow-600/50 bg-yellow-900/20' :
                                                            'border-slate-700 bg-slate-800 hover:border-cyan-500/50 cursor-pointer'
                                                        }`}
                                                    >
                                                        <div className="flex justify-between items-center">
                                                            <div>
                                                                <div className="flex items-center gap-2">
                                                                    {!isUnlocked && <span className="text-slate-500">🔒</span>}
                                                                    {isMastered && <span className="text-yellow-500">✅</span>}
                                                                    <h3 className={`font-bold ${isUnlocked ? 'text-cyan-300' : 'text-slate-500'}`}>{mod.title}</h3>
                                                                </div>
                                                                <p className="text-sm text-slate-400 mt-1">{mod.description}</p>
                                                            </div>
                                                            
                                                            {isUnlocked && (
                                                                <div className="text-right shrink-0 ml-4">
                                                                    <div className={`font-mono text-sm font-bold ${streak > 0 ? 'streak-fire' : 'text-slate-600'}`}>
                                                                        {streak}/7
                                                                    </div>
                                                                    {completedToday && <div className="text-xs text-green-400 mt-1">DONE</div>}
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const Workspace = ({ DATABASE, categoryKey, moduleKey, studyState, handleCompletion }) => {
            const data = DATABASE[categoryKey].modules[moduleKey];
            const moduleId = `${categoryKey}|${moduleKey}`;
            
            const [isLogging, setIsLogging] = useState(false);
            const [logStatus, setLogStatus] = useState(null);

            const [targetIdx, setTargetIdx] = useState(0);
            const [playCount, setPlayCount] = useState(0);

            const isCompletedToday = studyState.completedToday.includes(moduleId);
            const isDailyLimitReached = studyState.completedToday.length >= 3;
            const canVerify = !isCompletedToday && !isDailyLimitReached;
            const isSessionComplete = targetIdx === data.cards.length - 1 && playCount >= 10;

            const handleCardPlay = (cardIndex) => {
                if (cardIndex === targetIdx) {
                    setPlayCount(prev => prev + 1);
                }
            };

            const advanceSequence = () => {
                setTargetIdx(prev => prev + 1);
                setPlayCount(0);
            };

            const handleVerifyAndLog = async () => {
                setIsLogging(true);
                setLogStatus("Writing telemetry to Google Sheets...");
                
                try {
                    // Send progress to Tab 3
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({ moduleId: moduleId }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    
                    handleCompletion(categoryKey, moduleKey);
                    setLogStatus(`Success! Progress written to Database.`);
                } catch (error) {
                    console.error("Logging error:", error);
                    setLogStatus("Error syncing to cloud, but local streak updated.");
                    handleCompletion(categoryKey, moduleKey); 
                }
                setIsLogging(false);
            };

            return (
                <div className="animate-fade-in pb-12">
                    <div className="mb-8 border-b border-slate-700 pb-4 flex justify-between items-end gap-4">
                        <div>
                            <h2 className="text-2xl sm:text-3xl font-black text-white">{data.title}</h2>
                            <p className="text-cyan-400 mt-2 text-base sm:text-lg">{data.description}</p>
                        </div>
                        <div className="font-mono text-lg sm:text-xl font-bold streak-fire bg-slate-900 p-2 sm:p-3 rounded border border-slate-700 shrink-0">
                            🔥 {studyState.streaks[moduleId]?.count || 0}/7 
                        </div>
                    </div>

                    <div className="space-y-12">
                        {data.cards.slice(0, targetIdx + 1).map((card, index) => {
                            const isActiveTarget = index === targetIdx;
                            return (
                                <StudyCard 
                                    key={card.id} 
                                    card={card} 
                                    stepNum={index + 1} 
                                    isActiveTarget={isActiveTarget}
                                    playCount={isActiveTarget ? playCount : 10}
                                    onPlayFull={() => handleCardPlay(index)}
                                />
                            );
                        })}
                    </div>
                    
                    <div className="mt-12 pt-6 border-t border-slate-700 text-center flex flex-col items-center">
                        {!canVerify && !isCompletedToday && (
                            <div className="text-red-400 font-bold mb-4 bg-red-900/20 p-3 rounded border border-red-900/50">
                                🛑 DAILY BANDWIDTH REACHED (3/3). RETURN TOMORROW.
                            </div>
                        )}
                        
                        {targetIdx < data.cards.length - 1 ? (
                            <button 
                                onClick={advanceSequence}
                                disabled={playCount < 10}
                                className={`font-bold py-4 px-6 sm:px-10 rounded border tracking-widest text-sm sm:text-lg shadow-lg transition-all w-full sm:w-auto ${
                                    playCount < 10
                                        ? "bg-slate-800 text-slate-500 border-slate-700 cursor-not-allowed" 
                                        : "bg-cyan-600 hover:bg-cyan-500 text-white border-cyan-400 shadow-[0_0_15px_rgba(8,145,178,0.5)]"
                                }`}
                            >
                                {playCount < 10 ? `LOCKED: ${10 - playCount} REPS REMAINING` : "UNLOCK NEXT WORD"}
                            </button>
                        ) : (
                            <button 
                                onClick={handleVerifyAndLog}
                                disabled={!canVerify || isLogging || !isSessionComplete}
                                className={`font-bold py-4 px-6 sm:px-10 rounded border tracking-widest text-sm sm:text-lg shadow-lg transition-all w-full sm:w-auto ${
                                    (!canVerify || !isSessionComplete)
                                        ? "bg-slate-800 text-slate-500 border-slate-700 cursor-not-allowed" 
                                        : isLogging
                                            ? "bg-cyan-900 text-cyan-400 border-cyan-700 opacity-50"
                                            : "bg-cyan-600 hover:bg-cyan-500 text-white border-cyan-400 shadow-[0_0_15px_rgba(8,145,178,0.5)]"
                                }`}
                            >
                                {isCompletedToday ? "✅ COMPLETED FOR TODAY" : 
                                 !isSessionComplete ? `LOCKED: ${10 - playCount} REPS REMAINING` :
                                 isLogging ? "SYNCING..." : "COMMIT TO MEMORY & END SESSION"}
                            </button>
                        )}
                        
                        {logStatus && (
                            <div className="mt-4 text-cyan-400 font-mono text-sm bg-slate-800/80 p-3 rounded border border-cyan-900 w-full sm:w-auto">
                                {logStatus}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const StudyCard = ({ card, stepNum, isActiveTarget, playCount, onPlayFull }) => {
            const [activeTokenIdx, setActiveTokenIdx] = useState(null);

            const speakSequence = (tokens, specificIndex = null) => {
                if (!('speechSynthesis' in window)) {
                    alert("Browser does not support SpeechSynthesis.");
                    return;
                }
                
                window.speechSynthesis.cancel();
                window.speechUtterances = []; 

                if (specificIndex !== null) {
                    const utterance = new SpeechSynthesisUtterance(tokens[specificIndex].thai);
                    utterance.lang = 'th-TH';
                    utterance.rate = 0.8;
                    utterance.onend = () => setActiveTokenIdx(null);
                    window.speechUtterances.push(utterance);
                    setActiveTokenIdx(specificIndex);
                    window.speechSynthesis.speak(utterance);
                } else {
                    tokens.forEach((tok, idx) => {
                        const utterance = new SpeechSynthesisUtterance(tok.thai);
                        utterance.lang = 'th-TH';
                        utterance.rate = 0.75; 
                        
                        utterance.onstart = () => setActiveTokenIdx(idx);
                        if (idx === tokens.length - 1) {
                            utterance.onend = () => setActiveTokenIdx(null);
                        }
                        
                        window.speechUtterances.push(utterance);
                        window.speechSynthesis.speak(utterance);
                    });
                    
                    if (onPlayFull) {
                        onPlayFull();
                    }
                }
            };

            return (
                <div className={`bg-slate-800 border ${isActiveTarget ? 'border-cyan-500 shadow-[0_0_15px_rgba(8,145,178,0.2)]' : 'border-slate-700'} rounded-xl overflow-hidden shadow-md transition-all`}>
                    <div className="bg-slate-900 p-4 border-b border-slate-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 sm:gap-0">
                        <div className="flex items-center gap-3">
                            <span className="bg-cyan-900 text-cyan-300 font-bold px-3 py-1 rounded text-sm shrink-0">STEP {stepNum}</span>
                            <h3 className="text-lg sm:text-xl font-bold text-white uppercase tracking-wider">{card.english}</h3>
                        </div>
                        <span className="text-slate-400 text-xs sm:text-sm font-mono bg-slate-800 px-2 py-1 rounded w-full sm:w-auto text-left sm:text-right">{card.literal}</span>
                    </div>

                    <div className="p-4 sm:p-6">
                        <div className="flex flex-col gap-2 mb-6">
                            <button 
                                onClick={() => speakSequence(card.tokens)}
                                className="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 sm:py-4 px-4 rounded flex items-center justify-center gap-3 transition-colors border border-slate-500 shadow-lg text-sm sm:text-base"
                            >
                                ▶️ SOUND IT OUT
                            </button>
                            
                            {isActiveTarget && (
                                <div className="bg-slate-900 rounded-lg p-3 border border-cyan-800/50">
                                    <div className="flex justify-between text-xs font-bold text-cyan-400 mb-1 tracking-wider">
                                        <span>AUDIO REPETITIONS (MIN 10 REQUIRED)</span>
                                        <span>{playCount} Playbacks</span>
                                    </div>
                                    <div className="w-full bg-slate-800 rounded-full h-2">
                                        <div className="bg-cyan-500 h-2 rounded-full transition-all duration-300" style={{ width: `${Math.min((playCount / 10) * 100, 100)}%` }}></div>
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="bg-slate-900 border border-slate-700 rounded-lg p-4 sm:p-6">
                            <div className="flex flex-wrap justify-center gap-3 w-full">
                                {card.tokens.map((tok, idx) => (
                                    <div 
                                        key={idx}
                                        onClick={() => speakSequence(card.tokens, idx)}
                                        className={`flex flex-col items-center p-4 border-2 rounded-lg cursor-pointer transition-all duration-200 flex-1 min-w-[120px] max-w-[180px] ${
                                            activeTokenIdx === idx 
                                                ? 'border-cyan-400 bg-cyan-900/50 transform scale-105 shadow-[0_0_20px_rgba(34,211,238,0.4)]' 
                                                : 'border-slate-700 bg-slate-800 hover:border-slate-500'
                                        }`}
                                    >
                                        <div className="thai-text text-4xl sm:text-5xl font-black mb-3 text-white">{tok.thai}</div>
                                        <div className="w-full text-center space-y-1">
                                            <div className="text-cyan-300 font-mono text-sm sm:text-lg font-bold bg-black/30 rounded py-1 px-1 break-all">{tok.phonics}</div>
                                            <div className="text-slate-300 text-xs sm:text-sm font-semibold truncate px-1">"{tok.meaning}"</div>
                                            <div className="text-[9px] sm:text-[10px] uppercase tracking-wider font-bold mt-2 text-slate-400 bg-slate-900 border border-slate-700 px-2 py-1 rounded inline-block">
                                                {tok.tone} TONE
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
