<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Command Deck: Temporal Logistics</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .thai-text { font-family: "Sarabun", "Kanit", "Leelawadee UI", sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        .locked-module { opacity: 0.5; pointer-events: none; filter: grayscale(100%); }
        .streak-fire { color: #f97316; text-shadow: 0 0 10px rgba(249,115,22,0.5); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ==========================================
        // 🚨 YOUR DATABASE WEB APP URL GOES HERE 🚨
        // ==========================================
        const WEB_APP_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE"; 

        // ==========================================
        // DATA LOGISTICS: THE MASTER INDEX & MODULES
        // ==========================================
        const DATABASE = {
            temporal_logistics: {
                title: "Temporal Logistics (Dates & Time)",
                modules: {
                    days: {
                        title: "Days of the Week (The 'Wan' Protocol)",
                        description: "Every day starts with 'Wan' (Day) and is anchored to a celestial body.",
                        cards: [
                            { id: "d1", english: "Monday", literal: "Day + Moon", thaiFull: "วันจันทร์", tokens: [{ thai: "วัน", phonics: "Wan", meaning: "Day", tone: "Mid" }, { thai: "จันทร์", phonics: "Jan", meaning: "Moon", tone: "Mid" }] },
                            { id: "d2", english: "Tuesday", literal: "Day + Mars", thaiFull: "วันอังคาร", tokens: [{ thai: "วัน", phonics: "Wan", meaning: "Day", tone: "Mid" }, { thai: "อัง", phonics: "Ang", meaning: "Mars (Pt 1)", tone: "Mid" }, { thai: "คาร", phonics: "khaan", meaning: "Mars (Pt 2)", tone: "Mid" }] },
                            { id: "d3", english: "Wednesday", literal: "Day + Mercury", thaiFull: "วันพุธ", tokens: [{ thai: "วัน", phonics: "Wan", meaning: "Day", tone: "Mid" }, { thai: "พุธ", phonics: "Phut", meaning: "Mercury", tone: "High" }] },
                            { id: "d4", english: "Thursday", literal: "Day + Jupiter", thaiFull: "วันพฤหัสบดี", tokens: [{ thai: "วัน", phonics: "Wan", meaning: "Day", tone: "Mid" }, { thai: "พฤ", phonics: "Pha", meaning: "Jup (1)", tone: "High" }, { thai: "หัส", phonics: "hat", meaning: "Jup (2)", tone: "Low" }] },
                            { id: "d5", english: "Friday", literal: "Day + Venus", thaiFull: "วันศุกร์", tokens: [{ thai: "วัน", phonics: "Wan", meaning: "Day", tone: "Mid" }, { thai: "ศุกร์", phonics: "Suk", meaning: "Venus", tone: "Low" }] },
                            { id: "d6", english: "Saturday", literal: "Day + Saturn", thaiFull: "วันเสาร์", tokens: [{ thai: "วัน", phonics: "Wan", meaning: "Day", tone: "Mid" }, { thai: "เสาร์", phonics: "Sao", meaning: "Saturn", tone: "Rising" }] },
                            { id: "d7", english: "Sunday", literal: "Day + Sun", thaiFull: "วันอาทิตย์", tokens: [{ thai: "วัน", phonics: "Wan", meaning: "Day", tone: "Mid" }, { thai: "อา", phonics: "Aa", meaning: "Sun (1)", tone: "Mid" }, { thai: "ทิตย์", phonics: "thit", meaning: "Sun (2)", tone: "High" }] }
                        ]
                    },
                    months: {
                        title: "Months of the Year (30/31 Algorithm)",
                        description: "Months ending in -khom (คม) have 31 days. Months ending in -yon (ยน) have 30. -phan is Feb.",
                        cards: [
                            { id: "m1", english: "January", literal: "Makara + 31 Days", thaiFull: "มกราคม", tokens: [{ thai: "มก", phonics: "Mak", meaning: "Capricorn", tone: "High" }, { thai: "รา", phonics: "raa", meaning: "Zodiac suffix", tone: "Mid" }, { thai: "คม", phonics: "khom", meaning: "31 Days", tone: "Mid" }] },
                            { id: "m2", english: "April", literal: "Mesha + 30 Days", thaiFull: "เมษายน", tokens: [{ thai: "เม", phonics: "May", meaning: "Aries", tone: "Mid" }, { thai: "ษา", phonics: "saa", meaning: "Zodiac suffix", tone: "Rising" }, { thai: "ยน", phonics: "yon", meaning: "30 Days", tone: "Mid" }] }
                        ]
                    }
                }
            }
        };

        // GLOBAL UTTERANCE ARRAY (Prevents iOS Safari garbage collection from killing audio)
        window.speechUtterances = [];

        // ==========================================
        // UI COMPONENTS & LOGIC
        // ==========================================

        const App = () => {
            const [currentView, setCurrentView] = useState('HUB');
            const [activeCategory, setActiveCategory] = useState(null);
            const [activeModule, setActiveModule] = useState(null);
            const [expandedCategories, setExpandedCategories] = useState({});

            // --- SPACED REPETITION ENGINE ---
            const [studyState, setStudyState] = useState(() => {
                const saved = localStorage.getItem('thaiSpacedRepetition');
                const today = new Date().toDateString();
                
                // Build ordered list of all modules
                let allModules = [];
                Object.keys(DATABASE).forEach(cat => {
                    Object.keys(DATABASE[cat].modules).forEach(mod => {
                        allModules.push(`${cat}|${mod}`);
                    });
                });

                if (saved) {
                    let parsed = JSON.parse(saved);
                    // Daily Reset Logic
                    if (parsed.lastDate !== today) {
                        parsed.completedToday = []; // Reset daily limit
                        parsed.lastDate = today;
                        // Unlock one new module if available
                        if (parsed.unlockedCount < allModules.length) {
                            parsed.unlockedCount += 1;
                        }
                    }
                    parsed.allModules = allModules; 
                    return parsed;
                }

                // First time user setup
                return {
                    lastDate: today,
                    completedToday: [],
                    streaks: {}, // { 'cat|mod': { count: 0, lastStudied: null } }
                    unlockedCount: 1, // Start with exactly 1 unlocked module
                    allModules: allModules
                };
            });

            // Save state to local storage whenever it changes
            useEffect(() => {
                localStorage.setItem('thaiSpacedRepetition', JSON.stringify(studyState));
            }, [studyState]);

            const toggleCategory = (catKey) => {
                setExpandedCategories(prev => ({ ...prev, [catKey]: !prev[catKey] }));
            };

            const openWorkspace = (catKey, modKey) => {
                setActiveCategory(catKey);
                setActiveModule(modKey);
                setCurrentView('WORKSPACE');
            };

            const handleCompletion = (catKey, modKey) => {
                const moduleId = `${catKey}|${modKey}`;
                setStudyState(prev => {
                    let newStreaks = { ...prev.streaks };
                    let currentStreak = newStreaks[moduleId]?.count || 0;
                    
                    newStreaks[moduleId] = {
                        count: currentStreak + 1,
                        lastStudied: prev.lastDate
                    };

                    return {
                        ...prev,
                        completedToday: [...prev.completedToday, moduleId],
                        streaks: newStreaks
                    };
                });
            };

            return (
                <div className="min-h-screen bg-slate-900 text-slate-200 p-4 md:p-8 flex justify-center">
                    <div className="w-full max-w-4xl border border-slate-700 bg-slate-800 rounded-lg shadow-2xl overflow-hidden flex flex-col h-[90vh]">
                        <div className="bg-slate-950 border-b border-cyan-800/50 p-4 flex items-center justify-between shadow-md z-10">
                            <div className="flex items-center gap-4">
                                {currentView === 'WORKSPACE' && (
                                    <button 
                                        onClick={() => setCurrentView('HUB')}
                                        className="bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold py-1 px-4 rounded border border-cyan-800 transition-colors uppercase tracking-wider text-sm flex items-center gap-2"
                                    >
                                        <span>←</span> Hub
                                    </button>
                                )}
                                <h1 className="text-xl font-black tracking-widest text-slate-100 uppercase">
                                    Command Deck <span className="text-cyan-500 font-normal">| SR-Active</span>
                                </h1>
                            </div>
                            <div className="text-sm font-mono text-cyan-400 bg-cyan-900/30 px-3 py-1 rounded border border-cyan-800">
                                DAILY BANDWIDTH: {studyState.completedToday.length} / 3
                            </div>
                        </div>

                        <div className="flex-1 overflow-y-auto p-6 relative">
                            {currentView === 'HUB' && (
                                <MasterIndex 
                                    studyState={studyState}
                                    expanded={expandedCategories}
                                    toggle={toggleCategory}
                                    openWorkspace={openWorkspace}
                                />
                            )}
                            {currentView === 'WORKSPACE' && (
                                <Workspace 
                                    categoryKey={activeCategory} 
                                    moduleKey={activeModule}
                                    studyState={studyState}
                                    handleCompletion={handleCompletion}
                                />
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const MasterIndex = ({ studyState, expanded, toggle, openWorkspace }) => {
            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="mb-6 border-b border-slate-700 pb-4">
                        <h2 className="text-2xl font-bold text-white uppercase tracking-wider mb-2">Central Logistics Hub</h2>
                        <p className="text-slate-400 text-sm">Force 7-day mastery streaks. Max 3 sections per day. New modules unlock daily.</p>
                    </div>

                    <div className="space-y-4">
                        {Object.entries(DATABASE).map(([catKey, category]) => {
                            const isExpanded = expanded[catKey];
                            return (
                                <div key={catKey} className="border border-slate-700 rounded bg-slate-800/50 overflow-hidden">
                                    <button onClick={() => toggle(catKey)} className="w-full text-left p-4 bg-slate-800 hover:bg-slate-700 transition-colors flex justify-between items-center">
                                        <span className="font-bold text-lg text-cyan-50">{category.title}</span>
                                        <span className="text-cyan-500 font-mono text-xl">{isExpanded ? '−' : '+'}</span>
                                    </button>
                                    
                                    {isExpanded && (
                                        <div className="p-4 bg-slate-900/50 border-t border-slate-700 grid gap-3">
                                            {Object.entries(category.modules).map(([modKey, mod]) => {
                                                const moduleId = `${catKey}|${modKey}`;
                                                const globalIndex = studyState.allModules.indexOf(moduleId);
                                                const isUnlocked = globalIndex < studyState.unlockedCount;
                                                const streak = studyState.streaks[moduleId]?.count || 0;
                                                const isMastered = streak >= 7;
                                                const completedToday = studyState.completedToday.includes(moduleId);

                                                return (
                                                    <div 
                                                        key={modKey} 
                                                        onClick={() => isUnlocked ? openWorkspace(catKey, modKey) : null}
                                                        className={`p-4 border rounded transition-all group ${
                                                            !isUnlocked ? 'border-slate-800 bg-slate-900 locked-module' :
                                                            completedToday ? 'border-green-800/50 bg-green-900/20' :
                                                            isMastered ? 'border-yellow-600/50 bg-yellow-900/20' :
                                                            'border-slate-700 bg-slate-800 hover:border-cyan-500/50 cursor-pointer'
                                                        }`}
                                                    >
                                                        <div className="flex justify-between items-center">
                                                            <div>
                                                                <div className="flex items-center gap-2">
                                                                    {!isUnlocked && <span className="text-slate-500">🔒</span>}
                                                                    {isMastered && <span className="text-yellow-500">✅</span>}
                                                                    <h3 className={`font-bold ${isUnlocked ? 'text-cyan-300' : 'text-slate-500'}`}>{mod.title}</h3>
                                                                </div>
                                                                <p className="text-sm text-slate-400 mt-1">{mod.description}</p>
                                                            </div>
                                                            
                                                            {isUnlocked && (
                                                                <div className="text-right">
                                                                    <div className={`font-mono text-sm font-bold ${streak > 0 ? 'streak-fire' : 'text-slate-600'}`}>
                                                                        {streak}/7 STREAK
                                                                    </div>
                                                                    {completedToday && <div className="text-xs text-green-400 mt-1">DONE TODAY</div>}
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const Workspace = ({ categoryKey, moduleKey, studyState, handleCompletion }) => {
            const data = DATABASE[categoryKey].modules[moduleKey];
            const moduleId = `${categoryKey}|${moduleKey}`;
            
            const [isLogging, setIsLogging] = useState(false);
            const [logStatus, setLogStatus] = useState(null);

            const isCompletedToday = studyState.completedToday.includes(moduleId);
            const isDailyLimitReached = studyState.completedToday.length >= 3;
            
            const canVerify = !isCompletedToday && !isDailyLimitReached;

            const handleVerifyAndLog = async () => {
                if (WEB_APP_URL === "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE") {
                    alert("Apps Script URL missing in HTML. Fix Line 30.");
                    return;
                }
                
                setIsLogging(true);
                setLogStatus("Syncing to Google Sheets & Updating Streak...");
                
                try {
                    // 1. Log to your Google Sheet backup
                    await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({ topic: data.title }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    
                    // 2. Update Local Device Spaced Repetition State
                    handleCompletion(categoryKey, moduleKey);
                    setLogStatus(`Success! Streak increased. Section locked for today.`);
                } catch (error) {
                    console.error("Logging error:", error);
                    setLogStatus("Error syncing to cloud, but local streak updated.");
                    handleCompletion(categoryKey, moduleKey); // Allow local progress even if offline
                }
                setIsLogging(false);
            };

            return (
                <div className="animate-fade-in pb-12">
                    <div className="mb-8 border-b border-slate-700 pb-4 flex justify-between items-end">
                        <div>
                            <h2 className="text-3xl font-black text-white">{data.title}</h2>
                            <p className="text-cyan-400 mt-2 text-lg">{data.description}</p>
                        </div>
                        <div className="font-mono text-xl font-bold streak-fire bg-slate-900 p-3 rounded border border-slate-700">
                            🔥 {studyState.streaks[moduleId]?.count || 0}/7 
                        </div>
                    </div>

                    <div className="space-y-12">
                        {data.cards.map((card, index) => (
                            <StudyCard key={card.id} card={card} stepNum={index + 1} />
                        ))}
                    </div>
                    
                    <div className="mt-12 pt-6 border-t border-slate-700 text-center flex flex-col items-center">
                        {!canVerify && !isCompletedToday && (
                            <div className="text-red-400 font-bold mb-4 bg-red-900/20 p-3 rounded border border-red-900/50">
                                🛑 DAILY BANDWIDTH REACHED (3/3). RETURN TOMORROW.
                            </div>
                        )}
                        
                        <button 
                            onClick={handleVerifyAndLog}
                            disabled={!canVerify || isLogging}
                            className={`font-bold py-4 px-10 rounded border tracking-widest text-lg shadow-lg transition-all ${
                                !canVerify 
                                    ? "bg-slate-800 text-slate-500 border-slate-700 cursor-not-allowed" 
                                    : isLogging
                                        ? "bg-cyan-900 text-cyan-400 border-cyan-700 opacity-50"
                                        : "bg-cyan-600 hover:bg-cyan-500 text-white border-cyan-400 shadow-[0_0_15px_rgba(8,145,178,0.5)]"
                            }`}
                        >
                            {isCompletedToday ? "✅ COMPLETED FOR TODAY" : isLogging ? "SYNCING..." : "COMMIT TO MEMORY & END SESSION"}
                        </button>
                        
                        {logStatus && (
                            <div className="mt-4 text-cyan-400 font-mono text-sm bg-slate-800/80 p-3 rounded border border-cyan-900">
                                {logStatus}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- THE IOS-SAFE AUDIO ENGINE ---
        const StudyCard = ({ card, stepNum }) => {
            const [activeTokenIdx, setActiveTokenIdx] = useState(null);

            const speakSequence = (tokens, specificIndex = null) => {
                if (!('speechSynthesis' in window)) {
                    alert("Browser does not support SpeechSynthesis.");
                    return;
                }
                
                window.speechSynthesis.cancel();
                window.speechUtterances = []; // Clear old queue

                if (specificIndex !== null) {
                    const utterance = new SpeechSynthesisUtterance(tokens[specificIndex].thai);
                    utterance.lang = 'th-TH';
                    utterance.rate = 0.8;
                    utterance.onend = () => setActiveTokenIdx(null);
                    window.speechUtterances.push(utterance);
                    setActiveTokenIdx(specificIndex);
                    window.speechSynthesis.speak(utterance);
                } else {
                    // Queue all utterances immediately (Bypasses iOS strict timeout rules)
                    tokens.forEach((tok, idx) => {
                        const utterance = new SpeechSynthesisUtterance(tok.thai);
                        utterance.lang = 'th-TH';
                        utterance.rate = 0.75; // Slower for clarity
                        
                        utterance.onstart = () => setActiveTokenIdx(idx);
                        if (idx === tokens.length - 1) {
                            utterance.onend = () => setActiveTokenIdx(null);
                        }
                        
                        window.speechUtterances.push(utterance);
                        window.speechSynthesis.speak(utterance);
                    });
                }
            };

            return (
                <div className="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-md">
                    <div className="bg-slate-900 p-4 border-b border-slate-700 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <span className="bg-cyan-900 text-cyan-300 font-bold px-3 py-1 rounded text-sm">STEP {stepNum}</span>
                            <h3 className="text-xl font-bold text-white uppercase tracking-wider">{card.english}</h3>
                        </div>
                        <span className="text-slate-400 text-sm font-mono bg-slate-800 px-2 py-1 rounded">{card.literal}</span>
                    </div>

                    <div className="p-6">
                        <button 
                            onClick={() => speakSequence(card.tokens)}
                            className="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-4 px-4 rounded mb-6 flex items-center justify-center gap-3 transition-colors border border-slate-500 shadow-lg"
                        >
                            ▶️ PLAY FULL PHRASE (IOS SAFE)
                        </button>

                        <div className="bg-slate-900 border border-slate-700 rounded-lg p-6 overflow-x-auto">
                            <div className="flex gap-2 min-w-max">
                                {card.tokens.map((tok, idx) => (
                                    <div 
                                        key={idx}
                                        onClick={() => speakSequence(card.tokens, idx)}
                                        className={`flex flex-col items-center p-4 border-2 rounded-lg cursor-pointer transition-all duration-200 min-w-[120px] ${
                                            activeTokenIdx === idx 
                                                ? 'border-cyan-400 bg-cyan-900/50 transform scale-105 shadow-[0_0_20px_rgba(34,211,238,0.4)]' 
                                                : 'border-slate-700 bg-slate-800 hover:border-slate-500'
                                        }`}
                                    >
                                        <div className="thai-text text-5xl font-black mb-3 text-white">{tok.thai}</div>
                                        <div className="w-full text-center space-y-1">
                                            <div className="text-cyan-300 font-mono text-lg font-bold bg-black/30 rounded py-1">{tok.phonics}</div>
                                            <div className="text-slate-300 text-sm font-semibold truncate px-1">"{tok.meaning}"</div>
                                            <div className="text-[10px] uppercase tracking-wider font-bold mt-2 text-slate-400 bg-slate-900 border border-slate-700 px-2 py-1 rounded">
                                                {tok.tone} TONE
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
